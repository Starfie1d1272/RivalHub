verifyDepsBeforeRun: error
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
overrides:
  # GHSA-w5hq-g745-h8pq: brackets-manager@1.9.1 -> uuid@9.0.1（< 11.1.1 patched floor）。
  # path: .>brackets-manager>uuid；brackets-manager 最新 1.11.0 仍声明 uuid ^9.0.0，
  # 上游生态尚未迁移，无法通过升级 owner 自然解决。uuid 11.1.1 保留 CJS 出口
  # （dist/cjs），brackets-manager 的 require('uuid') 与 v4 API 兼容，经 bracket /
  # single-elim / double-elim / round-robin 全量格式测试验证。
  # 退出条件：brackets-manager 发布依赖 uuid >= 11 的版本后，移除本 override。
  'uuid@9.0.1': 11.1.1
  # GHSA-67mh-4wv8-2f99: drizzle-kit 经 @esbuild-kit/core-utils pin
  # esbuild ~0.18.20，声明范围无法到达 patched floor（>= 0.25.0）。
  # 对该精确实例收敛到 0.28.2：esbuild transform/加载 API 兼容，已通过
  # db:check、db:generate（无 schema 变更）、db:local:verify-migrations 与
  # Local integration smoke 验证。advisory 攻击面（dev server 未授权访问）
  # 仅在 esbuild serve 场景可达，drizzle-kit 不使用该场景。
  # 退出条件：drizzle-kit 移除 @esbuild-kit 或升级其 esbuild 范围后移除。
  'esbuild@0.18.20': 0.28.2
