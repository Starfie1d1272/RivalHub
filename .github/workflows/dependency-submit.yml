name: Submit dependency metadata

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      ref:
        required: true
        type: string
      snapshot_artifact:
        type: string
        default: dependency-snapshot
      receipt_artifact:
        type: string
        default: dependency-submission

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout, npm install, lifecycle script or PR executable runs here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.snapshot_artifact }}
      - name: Bind artifact to this exact source and submit dependency metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_REF: ${{ inputs.ref }}
        run: |
          jq -e --arg sha "$EXPECTED_SHA" --arg ref "$EXPECTED_REF" '
            .version == 0 and .sha == $sha and .ref == $ref and
            .job.correlator == (if $ref == "refs/heads/main" then "rivalhub-pnpm-lockfile" else "rivalhub-pnpm-lockfile-" + $ref end) and
            .detector.name == "rivalhub-pnpm-lockfile" and
            (.manifests | keys) == ["pnpm-lock.yaml"] and
            .manifests["pnpm-lock.yaml"].file.source_location == "pnpm-lock.yaml" and
            (.manifests["pnpm-lock.yaml"].resolved | length) > 0
          ' dependency-snapshot.json > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input dependency-snapshot.json > dependency-submission.json
          jq -e '.result == "SUCCESS"' dependency-submission.json
          jq --arg sha "$EXPECTED_SHA" --arg ref "$EXPECTED_REF" '. + {sha: $sha, ref: $ref}' dependency-submission.json > receipt.json
          mv receipt.json dependency-submission.json
          jq -c '{id, result, sha, ref, created_at}' dependency-submission.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.receipt_artifact }}
          path: dependency-submission.json
          if-no-files-found: error
          retention-days: 14

