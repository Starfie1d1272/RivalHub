name: Refresh Preview Data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      apply_current_migrations:
        description: Apply the selected ref's current migrations to the imported production-derived data in rivalhub-dev
        required: false
        default: false
        type: boolean
      migration_ref:
        description: Manual snapshot policy/current-migration branch used by both jobs; scheduled and post-release refreshes use main
        required: false
        default: main
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: rivalhub-preview-mirror-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export-production:
    name: export sanitized production mirror
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export read-only sanitized snapshot
        env:
          RIVALHUB_DB_TARGET: production
          RIVALHUB_PRODUCTION_PROJECT_CONFIRM: rrrebbxfghmgnoyyeqqd
          RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RIVALHUB_PRODUCTION_SUPABASE_URL: https://rrrebbxfghmgnoyyeqqd.supabase.co
          RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST: ${{ vars.RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST }}
          RIVALHUB_PREVIEW_MIGRATION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
        run: pnpm db:preview:export .agent-tmp/preview-mirror.json
      - name: Upload private short-lived mirror artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-mirror-${{ github.run_id }}
          path: .agent-tmp/preview-mirror.json
          if-no-files-found: error
          retention-days: 1

  refresh-dev:
    name: reset and refresh rivalhub-dev
    needs: export-production
    if: needs.export-production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download sanitized snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-mirror-${{ github.run_id }}
          path: .agent-tmp
      - name: Refresh dev mirror with explicit target authorization
        env:
          RIVALHUB_DB_TARGET: staging
          RIVALHUB_STAGING_PROJECT_CONFIRM: tpbqpbnuonnubiyfdrfe
          RIVALHUB_STAGING_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
          RIVALHUB_ALLOW_REMOTE_DB_WRITE: staging
          RIVALHUB_PREVIEW_RESET_CONFIRM: tpbqpbnuonnubiyfdrfe
          RIVALHUB_STAGING_DB_PASSWORD: ${{ secrets.RIVALHUB_STAGING_DB_PASSWORD }}
          RIVALHUB_PREVIEW_DEV_SECRET_KEY: ${{ secrets.RIVALHUB_PREVIEW_DEV_SECRET_KEY }}
          RIVALHUB_PREVIEW_APPLY_CURRENT_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_current_migrations || 'false' }}
          RIVALHUB_PREVIEW_MIGRATION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
        run: pnpm db:preview:refresh .agent-tmp/preview-mirror.json
