name: Refresh Preview Data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      apply_current_migrations:
        description: Apply the selected ref's current migrations to the imported production-derived data in rivalhub-dev
        required: false
        default: false
        type: boolean
      migration_ref:
        description: Manual snapshot policy/current-migration branch used by both jobs; scheduled and post-release refreshes use main
        required: false
        default: main
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: rivalhub-preview-mirror-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-policy:
    name: check preview refresh policy
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      refresh: ${{ steps.policy.outputs.refresh }}
    steps:
      - name: Decide without querying production
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          policy_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          # Retain an earlier successful preflight when only failed jobs were rerun.
          # Full reruns use their newer preflight, never a stale successful marker.
          # This marker is emitted from Release Plan, including resumed releases.
          # Older releases have no marker: skip the extra export; daily/manual remain.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?filter=all&per_page=100" \
            | jq -sr '[.[].jobs[] | select(.name == "preflight")] | max_by(.id) | select(.conclusion == "success") | .steps[]? | select(.name == "Preview mirror migration marker") | .conclusion' > "$RUNNER_TEMP/preview-migration-marker"
          if [[ "$(cat "$RUNNER_TEMP/preview-migration-marker")" == "success" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Release contains database migrations; refreshing Preview." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "offline_consumer_accounting_unavailable" >&2
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "No migration marker; daily/manual Preview refresh is sufficient." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "offline_consumer_accounting_unavailable" >&2
            python3 - "$policy_started_at" <<'PYTHON'
          import datetime, json, os, re, sys
          run = os.environ.get("GITHUB_RUN_ID", "")
          summary = dict(format=1, consumer="preview", run_id=run if re.fullmatch(r"\d+", run) else None,
                         github_run_id=run if re.fullmatch(r"\d+", run) else None,
                         release=None, source_project="ggkxqgbiudlovcgizgsq",
                         started_at=sys.argv[1], ended_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                         status="skipped", rows=None, logical_payload_bytes=None, dump_file_bytes=None,
                         snapshot_file_bytes=None, compressed_artifact_bytes=None,
                         storage_download_bytes=None, storage_objects=None, tables=None)
          encoded = json.dumps(summary, separators=(",", ":"))
          try:
              print("offline_consumer_summary " + encoded)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("\nOffline consumer accounting (not provider Egress):\n\n```json\n" + encoded + "\n```\n")
          except OSError:
              try:
                  print("offline_consumer_accounting_unavailable", file=sys.stderr)
              except OSError:
                  pass
          PYTHON
          fi

  export-production:
    name: export sanitized production mirror
    needs: refresh-policy
    if: needs.refresh-policy.outputs.refresh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export read-only sanitized snapshot
        env:
          DB_TRAFFIC_KEY: ${{ secrets.DB_TRAFFIC_KEY }}
          PRODUCT_TELEMETRY_ENDPOINT: ${{ vars.PRODUCT_TELEMETRY_ENDPOINT }}
          RIVALHUB_DB_TARGET: production
          RIVALHUB_PRODUCTION_PROJECT_CONFIRM: ggkxqgbiudlovcgizgsq
          RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RIVALHUB_PRODUCTION_SUPABASE_URL: https://ggkxqgbiudlovcgizgsq.supabase.co
          RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST: ${{ vars.RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST }}
          RIVALHUB_PREVIEW_MIGRATION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
        run: pnpm db:preview:export .agent-tmp/preview-mirror.json
      - name: Upload private short-lived mirror artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-mirror-${{ github.run_id }}
          path: .agent-tmp/preview-mirror.json
          if-no-files-found: error
          retention-days: 1

  refresh-dev:
    name: reset and refresh rivalhub-dev
    needs: export-production
    if: needs.export-production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download sanitized snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-mirror-${{ github.run_id }}
          path: .agent-tmp
      - name: Refresh dev mirror with explicit target authorization
        env:
          RIVALHUB_DB_TARGET: staging
          RIVALHUB_STAGING_PROJECT_CONFIRM: dtdzxnzjtohzjmfkighg
          RIVALHUB_STAGING_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
          RIVALHUB_ALLOW_REMOTE_DB_WRITE: staging
          RIVALHUB_PREVIEW_RESET_CONFIRM: dtdzxnzjtohzjmfkighg
          RIVALHUB_STAGING_DB_PASSWORD: ${{ secrets.RIVALHUB_STAGING_DB_PASSWORD }}
          RIVALHUB_PREVIEW_DEV_SECRET_KEY: ${{ secrets.RIVALHUB_PREVIEW_DEV_SECRET_KEY }}
          RIVALHUB_PREVIEW_APPLY_CURRENT_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_current_migrations || 'false' }}
          RIVALHUB_PREVIEW_MIGRATION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || 'main' }}
        run: pnpm db:preview:refresh .agent-tmp/preview-mirror.json
