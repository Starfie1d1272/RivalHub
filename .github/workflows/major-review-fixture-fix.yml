name: Major review fixture fix

on:
  push:
    branches: ["refactor/major-runtime"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/major-runtime
          fetch-depth: 0
      - run: python3 scripts/major-review-fixture-fix.py
      - run: git diff --check
      - name: Commit fixture fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/major-review-fixture-fix.yml scripts/major-review-fixture-fix.py
          git add tests/integration/db/discipline.test.ts tests/integration/db/major-roster-safety.test.ts tests/integration/db/postevent.test.ts
          git commit -m "test(major): align integration fixtures with canonical runtime"
          git push origin HEAD:refactor/major-runtime
