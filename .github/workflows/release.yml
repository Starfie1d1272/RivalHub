name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（仅用于失败后的安全重试）"
        required: true
        type: string

concurrency:
  group: rivalhub-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Fixed non-secret Vercel target. VERCEL_TOKEN authorizes the exact
      # production deployment; DATABASE_URL is a GitHub production Environment
      # secret dedicated to the protected migration runner below.
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
        # 无论 tag push 或显式 retry，数据库、部署、changelog 与 GitHub Release
        # 都必须来自同一个不可变 tag commit。

      - name: Require release tag commit on main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is invalid." >&2
            exit 1
          fi
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_SHA" != "$TAG_SHA" ]]; then
            echo "Release checkout does not match tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit contained in main." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: pnpm add --global vercel@59.10.0

      - name: Require Vercel release credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "GitHub production environment secret VERCEL_TOKEN is required." >&2
            exit 1
          fi
          # Project-scoped tokens can deploy but cannot read project settings
          # or export Sensitive values. The later exact deployment is the
          # authoritative capability check; this step must not call `pull`.

      - name: Validate active migration chain locally
        run: |
          pnpm db:check
          pnpm db:local:start

      - name: Migrate and verify production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret DATABASE_URL is required." >&2
            exit 1
          fi
          RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          pnpm db:production:verify

      - name: Deploy exact release commit to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env RIVALHUB_RELEASE_TAG="$RELEASE_TAG" \
            --build-env RIVALHUB_RELEASE_COMMIT="$RELEASE_SHA")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Smoke test production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$DEPLOYMENT_URL/" >/dev/null
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "https://match.starfie1d.top/" >/dev/null

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          # 兼容两种标题：手写 `## [1.30.0] - date` 与 changeset 生成的 `## 1.30.0`
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "(\\]| |$)" { found=1; next }
            found && $0 ~ "^## \\[?[0-9]" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists, updating notes..."
            gh release edit "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi

      - name: Stop Local Supabase
        if: always()
        run: pnpm db:local:stop || true
