name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "重试已有 release tag"
        required: true
        type: string
      previous_release_tag:
        description: "仅当该 tag 已经成为 canonical Production 时填写：首次 run 冻结的 previous release tag"
        required: false
        type: string
      previous_release_commit:
        description: "与 previous_release_tag 配对：首次 run 冻结的 previous release commit SHA"
        required: false
        type: string

concurrency:
  group: rivalhub-release-lineage
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RIVALHUB_RETRY_PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag || '' }}
      RIVALHUB_RETRY_PREVIOUS_RELEASE_COMMIT: ${{ inputs.previous_release_commit || '' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
      release_sha: ${{ steps.release_identity.outputs.release_sha }}
      previous_release_tag: ${{ steps.frozen_identity.outputs.previous_release_tag }}
      previous_release_commit: ${{ steps.frozen_identity.outputs.previous_release_commit }}
      release_mode: ${{ steps.frozen_identity.outputs.release_mode }}
      migration_risk: ${{ steps.plan.outputs.migrationRisk }}
      storage_mutation_changed: ${{ steps.plan.outputs.storageMutationChanged }}
      scheduler_changed: ${{ steps.plan.outputs.schedulerChanged }}
      requires_scheduler_provision: ${{ steps.plan.outputs.requiresSchedulerProvision }}
      recovery_infra_changed: ${{ steps.plan.outputs.recoveryInfraChanged }}
      release_infra_changed: ${{ steps.plan.outputs.releaseInfraChanged }}
      requires_migration_rehearsal: ${{ steps.plan.outputs.requiresMigrationRehearsal }}
      requires_production_migration: ${{ steps.plan.outputs.requiresProductionMigration }}
      requires_steam_profile_backfill: ${{ steps.plan.outputs.requiresSteamProfileBackfill }}
      requires_db_checkpoint: ${{ steps.plan.outputs.requiresDbCheckpoint }}
      requires_full_checkpoint: ${{ steps.plan.outputs.requiresFullCheckpoint }}
      checkpoint_kind: ${{ steps.checkpoint_kind.outputs.kind }}
      workflow_started_at: ${{ steps.workflow_start.outputs.started_at }}
    steps:
      - name: 记录 workflow 起点
        id: workflow_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 验证 release tag 位于 main
        id: release_identity
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG 无效。" >&2
            exit 1
          fi
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_SHA" != "$TAG_SHA" ]]; then
            echo "Checkout 与 tag $RELEASE_TAG 不一致。" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG 未指向 main 包含的 commit。" >&2
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RIVALHUB_RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: 记录 bootstrap 耗时起点
        run: echo "RELEASE_BOOTSTRAP_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 冻结 previous Production identity
        run: node scripts/ci/timing.mjs "Freeze previous Production identity" -- pnpm release:freeze-identity

      - name: 导出 frozen release identity
        id: frozen_identity
        run: |
          set -euo pipefail
          echo "previous_release_tag=$RIVALHUB_PREVIOUS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_release_commit=$RIVALHUB_PREVIOUS_RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_mode=$RIVALHUB_RELEASE_MODE" >> "$GITHUB_OUTPUT"

      - name: 生成 machine-readable Release Plan
        id: plan
        run: node scripts/ci/timing.mjs "Release plan" -- pnpm release:plan

      - name: 运行 changed migration checks
        if: steps.plan.outputs.migrationChanged == 'true'
        run: node scripts/ci/timing.mjs "Migration checks" -- pnpm db:check

      - name: 验证 previous Production compatibility
        if: steps.plan.outputs.migrationChanged == 'true'
        run: node scripts/ci/timing.mjs "Migration compatibility" -- pnpm db:release-compat

      - name: 计算 recovery checkpoint gate
        id: checkpoint_kind
        run: |
          if [[ "${{ steps.plan.outputs.requiresFullCheckpoint }}" == "true" ]]; then
            echo "kind=full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.plan.outputs.requiresDbCheckpoint }}" == "true" ]]; then
            echo "kind=db-only" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录 bootstrap 耗时
        run: node scripts/ci/timing.mjs record --label "Bootstrap" --start-ms "$RELEASE_BOOTSTRAP_START_MS"

      - name: 验证 exact-SHA CI prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/timing.mjs "Wait exact-SHA CI prerequisite" -- pnpm release:ci-prerequisite

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  migration_rehearsal:
    if: needs.preflight.result == 'success' && needs.preflight.outputs.release_mode == 'fresh' && needs.preflight.outputs.requires_migration_rehearsal == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: read
    env:
      CI: true
      RIVALHUB_TIMING: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_DB_TARGET: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 回放 PG17 active migration chain
        run: node scripts/ci/timing.mjs "PG17 migration rehearsal" -- pnpm db:release-rehearsal

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  checkpoint:
    if: needs.preflight.result == 'success' && needs.preflight.outputs.release_mode == 'fresh' && needs.preflight.outputs.checkpoint_kind != 'none'
    needs: preflight
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      CHECKPOINT_KIND: ${{ needs.preflight.outputs.checkpoint_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 安装 age
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: 创建 DB-only release checkpoint
        if: env.CHECKPOINT_KIND == 'db-only'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
          RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
          RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
          RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
          RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci/timing.mjs "DB-only release checkpoint" -- pnpm db:recovery:checkpoint

      - name: 创建 full release checkpoint
        if: env.CHECKPOINT_KIND == 'full'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
          RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
          RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
          RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
          RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci/timing.mjs "Full release checkpoint" -- pnpm db:recovery:backup pre-release

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  candidate_build:
    if: needs.preflight.result == 'success' && needs.preflight.outputs.release_mode == 'fresh'
    needs: preflight
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 安装固定版本 Vercel CLI
        run: pnpm add --global vercel@59.11.7

      - name: 验证 Vercel deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || "$VERCEL_TOKEN" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret VERCEL_TOKEN 未设置。" >&2
            exit 1
          fi

      - name: 部署 Vercel candidate
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_START="$(date +%s%3N)"
          DEPLOYMENT_URL="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" \
            --build-env RIVALHUB_RELEASE_TAG="$RELEASE_TAG" \
            --build-env RIVALHUB_RELEASE_COMMIT="$RELEASE_SHA")"
          DEPLOY_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "Vercel candidate build/deploy" --start-ms "$DEPLOY_START" --end-ms "$DEPLOY_END"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Candidate deployment ready: $DEPLOYMENT_URL"

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  production_migration:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.candidate_build.result == 'success' || needs.candidate_build.result == 'skipped') &&
      (needs.migration_rehearsal.result == 'success' || needs.migration_rehearsal.result == 'skipped') &&
      (needs.checkpoint.result == 'success' || needs.checkpoint.result == 'skipped') &&
      needs.preflight.outputs.release_mode == 'fresh' &&
      needs.preflight.outputs.requires_production_migration == 'true'
    needs: [preflight, candidate_build, migration_rehearsal, checkpoint]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: rivalhub-production-state-serialization
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.preflight.outputs.release_tag }}
          fetch-depth: 0

      - name: 验证 release operator 与 candidate migration chain
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_OPERATOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null
          git rev-parse --verify "$RELEASE_OPERATOR_SHA^{commit}" >/dev/null
          if ! git diff --quiet "$RELEASE_TAG" "$RELEASE_OPERATOR_SHA" -- \
            drizzle/migrations \
            drizzle/meta \
            drizzle.production.config.ts \
            scripts/db/migration-replay.ts \
            scripts/db/verify-migrations.ts \
            scripts/db/production.ts \
            scripts/db/production-environment.ts \
            package.json \
            pnpm-lock.yaml
          then
            echo "Release operator checkout changed candidate migration inputs; refusing production migration." >&2
            exit 1
          fi

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 运行 production migration 与验证
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIVALHUB_RELEASE_MIGRATION_REHEARSAL: ${{ needs.migration_rehearsal.result == 'success' && 'pg17' || '' }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret DATABASE_URL 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "Production migration" -- env RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          node scripts/ci/timing.mjs "Production DB verify" -- pnpm db:production:verify

      - name: 回填 production Steam profile cache
        if: needs.preflight.outputs.requires_steam_profile_backfill == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          RIVALHUB_ALLOW_REMOTE_DB_WRITE: production
          RIVALHUB_STEAM_PROFILE_WRITE_CONFIRM: I_UNDERSTAND_STEAM_PROFILE_CACHE_WRITE
        run: |
          set -euo pipefail
          if [[ -z "$STEAM_API_KEY" || "$STEAM_API_KEY" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret STEAM_API_KEY 未设置；拒绝在 app switch 前继续。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "Production Steam profile backfill" -- pnpm db:production:steam-profile:backfill -- --apply

      - name: 验证 production Steam profile coverage
        if: needs.preflight.outputs.requires_steam_profile_backfill == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/timing.mjs "Production Steam profile coverage" -- pnpm db:production:steam-profile:coverage

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  finalize:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.candidate_build.result == 'success' || needs.candidate_build.result == 'skipped') &&
      (needs.migration_rehearsal.result == 'success' || needs.migration_rehearsal.result == 'skipped') &&
      (needs.checkpoint.result == 'success' || needs.checkpoint.result == 'skipped') &&
      (needs.production_migration.result == 'success' || needs.production_migration.result == 'skipped')
    needs: [preflight, candidate_build, migration_rehearsal, checkpoint, production_migration]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: ${{ needs.preflight.outputs.requires_scheduler_provision == 'true' && 'rivalhub-production-state-serialization' || format('rivalhub-release-post-promotion-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RIVALHUB_PREVIOUS_RELEASE_TAG: ${{ needs.preflight.outputs.previous_release_tag }}
      RIVALHUB_PREVIOUS_RELEASE_COMMIT: ${{ needs.preflight.outputs.previous_release_commit }}
      RELEASE_MODE: ${{ needs.preflight.outputs.release_mode }}
      RIVALHUB_RELEASE_MODE: ${{ needs.preflight.outputs.release_mode }}
      REQUIRES_SCHEDULER_PROVISION: ${{ needs.preflight.outputs.requires_scheduler_provision }}
      RELEASE_WORKFLOW_STARTED_AT: ${{ needs.preflight.outputs.workflow_started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 获取 Vercel Trusted Source OIDC token
        if: env.RELEASE_MODE == 'fresh'
        id: oidc
        env:
          VERCEL_TRUSTED_SOURCE_AUDIENCE: https://github.com/Starfie1d1272
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC endpoint 不可用。" >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$VERCEL_TRUSTED_SOURCE_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: 运行 exact candidate smoke test
        if: env.RELEASE_MODE == 'fresh'
        env:
          DEPLOYMENT_URL: ${{ needs.candidate_build.outputs.deployment_url }}
          VERCEL_TRUSTED_OIDC_IDP_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          SMOKE_START="$(date +%s%3N)"
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9][a-z0-9-]*\.vercel\.app/?$ ]]; then
            echo "Vercel deployment URL 不是 exact *.vercel.app HTTPS target：$DEPLOYMENT_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/" >/dev/null
          deployment_identity="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/api/system/release")"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" '
            (keys | sort) == ["releaseCommit", "releaseTag"]
            and .releaseTag == $tag
            and .releaseCommit == $commit
          ' <<<"$deployment_identity" >/dev/null
          SMOKE_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "Exact candidate smoke" --start-ms "$SMOKE_START" --end-ms "$SMOKE_END"
          echo "Candidate smoke verified release identity: $deployment_identity"

      - name: 执行 release routing / rollback
        if: env.RELEASE_MODE == 'fresh'
        env:
          DEPLOYMENT_URL: ${{ needs.candidate_build.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/timing.mjs "Release routing / rollback" -- pnpm release:routing

      - name: 配置并验证 production scheduler
        if: env.REQUIRES_SCHEDULER_PROVISION == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_BASE_URL: https://match.starfie1d.top
        run: |
          if [[ -z "$CRON_SECRET" || "$CRON_SECRET" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret CRON_SECRET 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "Production scheduler provision/verify" -- bash -c '
            set -euo pipefail
            RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:scheduler:provision
            pnpm db:production:scheduler:verify
          '

      - name: 生成 Production delta release notes
        run: pnpm release:notes > /tmp/release-notes.md

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_PUB_START="$(date +%s%3N)"
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" == "true" ]]; then
              echo "GitHub Release $RELEASE_TAG 已 immutable；保留已发布 metadata。"
            else
              echo "GitHub Release $RELEASE_TAG 已存在，更新 notes…"
              gh release edit "$RELEASE_TAG" \
                --notes-file /tmp/release-notes.md \
                "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi
          RELEASE_PUB_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "GitHub Release publish" --start-ms "$RELEASE_PUB_START" --end-ms "$RELEASE_PUB_END"

      - name: 记录 workflow 总耗时并生成 summary
        if: always()
        run: |
          node scripts/ci/timing.mjs record --label "Total" --start-iso "$RELEASE_WORKFLOW_STARTED_AT"
          node scripts/ci/timing.mjs summary
