name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（仅用于失败后的安全重试）"
        required: true
        type: string

concurrency:
  group: rivalhub-production-state-serialization
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Fixed non-secret Vercel target. VERCEL_TOKEN is the project-scoped
      # deployment credential. Protected smoke obtains a short-lived GitHub
      # OIDC token at runtime. DATABASE_URL is a GitHub production Environment
      # secret dedicated to the protected migration runner.
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_STABLE_REF: origin/main
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
        # 无论 tag push 或显式 retry，数据库、部署、changelog 与 GitHub Release
        # 都必须来自同一个不可变 tag commit。

      - name: Require release tag commit on main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is invalid." >&2
            exit 1
          fi
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_SHA" != "$TAG_SHA" ]]; then
            echo "Release checkout does not match tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit contained in main." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Install pinned Vercel CLI
        run: pnpm add --global vercel@59.11.7

      - name: Require Vercel deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || "$VERCEL_TOKEN" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret VERCEL_TOKEN is required." >&2
            exit 1
          fi
          # VERCEL_TOKEN must remain project-scoped (`rivalhub-release`) and is
          # used only by the exact production deploy command below.

      - name: Validate active migration chain locally
        run: |
          pnpm db:check
          pnpm db:local:start

      - name: Validate previous release compatibility
        run: pnpm db:release-compat

      - name: Install age encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: Create protected pre-release backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
          RIVALHUB_BACKUP_HEARTBEAT_URL: ${{ secrets.RIVALHUB_BACKUP_HEARTBEAT_URL }}
          RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
          RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
          RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
          RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
        run: pnpm db:recovery:backup pre-release

      - name: Migrate and verify production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret DATABASE_URL is required." >&2
            exit 1
          fi
          RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          pnpm db:production:verify

      - name: Deploy exact release commit to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env RIVALHUB_RELEASE_TAG="$RELEASE_TAG" \
            --build-env RIVALHUB_RELEASE_COMMIT="$RELEASE_SHA")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: oidc
        env:
          VERCEL_TRUSTED_SOURCE_AUDIENCE: https://github.com/Starfie1d1272
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC request endpoint is unavailable." >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$VERCEL_TRUSTED_SOURCE_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: Smoke test production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TRUSTED_OIDC_IDP_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9][a-z0-9-]*\.vercel\.app/?$ ]]; then
            echo "Vercel deployment URL is not an exact *.vercel.app HTTPS target: $DEPLOYMENT_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/" >/dev/null
          deployment_identity="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/api/system/release")"
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$RIVALHUB_PRODUCTION_BASE_URL/" >/dev/null
          canonical_identity="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$RIVALHUB_PRODUCTION_BASE_URL/api/system/release")"
          for identity in "$deployment_identity" "$canonical_identity"; do
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" '
              (keys | sort) == ["releaseCommit", "releaseTag"]
              and .releaseTag == $tag
              and .releaseCommit == $commit
            ' <<<"$identity" >/dev/null
          done

      - name: Provision and verify production scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_BASE_URL: https://match.starfie1d.top
        run: |
          if [[ -z "$CRON_SECRET" || "$CRON_SECRET" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret CRON_SECRET is required." >&2
            exit 1
          fi
          RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:scheduler:provision
          pnpm db:production:scheduler:verify

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          # 兼容两种标题：手写 `## [1.30.0] - date` 与 changeset 生成的 `## 1.30.0`
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "(\\]| |$)" { found=1; next }
            found && $0 ~ "^## \\[?[0-9]" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" == "true" ]]; then
              echo "Release $RELEASE_TAG is immutable; keeping published metadata."
            else
              echo "Release $RELEASE_TAG already exists, updating notes..."
              gh release edit "$RELEASE_TAG" \
                --notes-file /tmp/release-notes.md \
                "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi

      - name: Stop Local Supabase
        if: always()
        run: pnpm db:local:stop || true
