name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的发布 tag（仅用于失败后的安全重试）"
        required: true
        type: string

concurrency:
  group: rivalhub-production-state-serialization
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "发布阶段耗时"
      # 固定的非敏感 Vercel 目标。VERCEL_TOKEN 是项目级凭据，仅用于部署及
      # 项目级切换/回退 API 调用。受保护冒烟检查在运行时获取短期 GitHub
      # OIDC 令牌。DATABASE_URL 是 GitHub 生产环境密钥，仅供受保护迁移运行器使用。
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 记录工作流耗时起点
        run: echo "RELEASE_WORKFLOW_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
        # 无论推送 tag 还是显式重试，数据库、部署、CHANGELOG 与 GitHub 发布说明
        # 都必须来自同一个不可变 tag commit。

      - name: 要求发布 tag 提交位于 main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "发布 tag $RELEASE_TAG 无效。" >&2
            exit 1
          fi
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_SHA" != "$TAG_SHA" ]]; then
            echo "检出的发布内容与 tag $RELEASE_TAG 不一致。" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "发布 tag $RELEASE_TAG 未指向 main 包含的提交。" >&2
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: 记录初始化与安装耗时起点
        run: echo "RELEASE_BOOTSTRAP_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 冻结权威上一生产版本身份标识
        run: node scripts/ci/timing.mjs "冻结上一生产版本身份标识" -- pnpm release:freeze-identity

      - name: 安装固定版本的 Vercel CLI
        run: pnpm add --global vercel@59.11.7

      - name: 记录初始化与安装耗时
        run: node scripts/ci/timing.mjs record --label "初始化与安装" --start-ms "$RELEASE_BOOTSTRAP_START_MS"

      - name: 验证精确 SHA 持续集成前置条件
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/timing.mjs "预检查精确 SHA 持续集成等待" -- pnpm release:ci-prerequisite

      - name: 要求 Vercel 部署凭据
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || "$VERCEL_TOKEN" == "[SENSITIVE]" ]]; then
            echo "GitHub 生产环境密钥 VERCEL_TOKEN 未设置。" >&2
            exit 1
          fi
          # VERCEL_TOKEN 必须保持项目级（`rivalhub-release`），且只能用于下方的
          # 精确生产部署和路由 API 调用。

      - name: 在本地验证活动迁移链
        run: |
          pnpm db:check
          node scripts/ci/timing.mjs "仅数据库的本地就绪检查" -- pnpm db:local:start-db

      - name: 验证上一版本兼容性
        run: node scripts/ci/timing.mjs "迁移演练" -- pnpm db:release-compat

      - name: 安装 age 加密工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: 创建受保护的发布前备份
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
          RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
          RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
          RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
          RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci/timing.mjs "新建备份总耗时" -- pnpm db:recovery:backup pre-release

      - name: 迁移并验证生产数据库
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub 生产环境密钥 DATABASE_URL 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "生产数据库迁移" -- env RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          node scripts/ci/timing.mjs "生产数据库验证" -- pnpm db:production:verify

      - name: 将候选版本分阶段部署到 Vercel 生产环境
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_START="$(date +%s%3N)"
          DEPLOYMENT_URL="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" \
            --build-env RIVALHUB_RELEASE_TAG="$RELEASE_TAG" \
            --build-env RIVALHUB_RELEASE_COMMIT="$RELEASE_SHA")"
          DEPLOY_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "Vercel 候选版本构建与部署" --start-ms "$DEPLOY_START" --end-ms "$DEPLOY_END"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "候选版本已完成分阶段部署：$DEPLOYMENT_URL"

      - name: 获取用于 Vercel Trusted Source 的 GitHub OIDC 令牌
        id: oidc
        env:
          VERCEL_TRUSTED_SOURCE_AUDIENCE: https://github.com/Starfie1d1272
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC 请求端点不可用。" >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$VERCEL_TRUSTED_SOURCE_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: 对候选部署执行冒烟检查
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TRUSTED_OIDC_IDP_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          SMOKE_START="$(date +%s%3N)"
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9][a-z0-9-]*\.vercel\.app/?$ ]]; then
            echo "Vercel 部署 URL 不是精确的 *.vercel.app HTTPS 目标：$DEPLOYMENT_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/" >/dev/null
          deployment_identity="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/api/system/release")"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" '
            (keys | sort) == ["releaseCommit", "releaseTag"]
            and .releaseTag == $tag
            and .releaseCommit == $commit
          ' <<<"$deployment_identity" >/dev/null
          SMOKE_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "精确部署冒烟检查" --start-ms "$SMOKE_START" --end-ms "$SMOKE_END"
          echo "候选部署冒烟检查已验证身份标识：$deployment_identity"

      - name: 切换候选版本并验证权威生产环境
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/timing.mjs "路由收敛与回退补偿" -- pnpm release:routing

      - name: 配置并验证生产环境调度任务
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_BASE_URL: https://match.starfie1d.top
        run: |
          if [[ -z "$CRON_SECRET" || "$CRON_SECRET" == "[SENSITIVE]" ]]; then
            echo "GitHub 生产环境密钥 CRON_SECRET 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "调度任务配置与验证" -- bash -c '
            set -euo pipefail
            RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:scheduler:provision
            pnpm db:production:scheduler:verify
          '

      - name: 构建生产版本差异发布说明
        run: pnpm release:notes > /tmp/release-notes.md

      - name: 创建 GitHub 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_PUB_START="$(date +%s%3N)"
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" == "true" ]]; then
              echo "发布 $RELEASE_TAG 不可变；保留已发布元数据。"
            else
              echo "发布 $RELEASE_TAG 已存在，正在更新说明……"
              gh release edit "$RELEASE_TAG" \
                --notes-file /tmp/release-notes.md \
                "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi
          RELEASE_PUB_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "GitHub 发布说明发布" --start-ms "$RELEASE_PUB_START" --end-ms "$RELEASE_PUB_END"

      - name: 记录工作流总耗时并生成摘要
        if: always()
        run: |
          if [[ -n "$RELEASE_WORKFLOW_START_MS" ]]; then
            node scripts/ci/timing.mjs record --label "总耗时" --start-ms "$RELEASE_WORKFLOW_START_MS"
          fi
          node scripts/ci/timing.mjs summary
