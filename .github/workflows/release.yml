name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（仅用于失败后的安全重试）"
        required: true
        type: string

concurrency:
  group: rivalhub-production-state-serialization
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release phase timing"
      # Fixed non-secret Vercel target. VERCEL_TOKEN is the project-scoped
      # credential for deployment and project-scoped promotion/rollback API
      # calls. Protected smoke obtains a short-lived GitHub OIDC token at
      # runtime. DATABASE_URL is a GitHub production Environment secret
      # dedicated to the protected migration runner.
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_STABLE_REF: origin/main
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Capture workflow timing start
        run: echo "RELEASE_WORKFLOW_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
        # 无论 tag push 或显式 retry，数据库、部署、changelog 与 GitHub Release
        # 都必须来自同一个不可变 tag commit。

      - name: Require release tag commit on main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is invalid." >&2
            exit 1
          fi
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$RELEASE_SHA" != "$TAG_SHA" ]]; then
            echo "Release checkout does not match tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit contained in main." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Start bootstrap/install timing
        run: echo "RELEASE_BOOTSTRAP_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Install pinned Vercel CLI
        run: pnpm add --global vercel@59.11.7

      - name: Record bootstrap/install timing
        run: node scripts/ci/timing.mjs record --label "bootstrap/install" --start-ms "$RELEASE_BOOTSTRAP_START_MS"

      - name: Verify exact-SHA CI prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/timing.mjs "preflight exact-SHA CI wait" -- pnpm release:ci-prerequisite

      - name: Require Vercel deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || "$VERCEL_TOKEN" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret VERCEL_TOKEN is required." >&2
            exit 1
          fi
          # VERCEL_TOKEN must remain project-scoped (`rivalhub-release`) and is
          # used only by the exact production deploy and routing API calls below.

      - name: Validate active migration chain locally
        run: |
          pnpm db:check
          node scripts/ci/timing.mjs "DB-only local readiness" -- pnpm db:local:start-db

      - name: Validate previous release compatibility
        run: node scripts/ci/timing.mjs "migration rehearsal" -- pnpm db:release-compat

      - name: Install age encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: Create protected pre-release backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
          RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
          RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
          RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
          RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci/timing.mjs "fresh backup total" -- pnpm db:recovery:backup pre-release

      - name: Migrate and verify production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret DATABASE_URL is required." >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "production migration" -- env RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          node scripts/ci/timing.mjs "production verify" -- pnpm db:production:verify

      - name: Deploy candidate to Vercel Production (staged)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_START="$(date +%s%3N)"
          DEPLOYMENT_URL="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" \
            --build-env RIVALHUB_RELEASE_TAG="$RELEASE_TAG" \
            --build-env RIVALHUB_RELEASE_COMMIT="$RELEASE_SHA")"
          DEPLOY_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "Vercel candidate build/deploy" --start-ms "$DEPLOY_START" --end-ms "$DEPLOY_END"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Staged candidate deployment: $DEPLOYMENT_URL"

      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: oidc
        env:
          VERCEL_TRUSTED_SOURCE_AUDIENCE: https://github.com/Starfie1d1272
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC request endpoint is unavailable." >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$VERCEL_TRUSTED_SOURCE_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TRUSTED_OIDC_IDP_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          SMOKE_START="$(date +%s%3N)"
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9][a-z0-9-]*\.vercel\.app/?$ ]]; then
            echo "Vercel deployment URL is not an exact *.vercel.app HTTPS target: $DEPLOYMENT_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/" >/dev/null
          deployment_identity="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_IDP_TOKEN" \
            "$DEPLOYMENT_URL/api/system/release")"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" '
            (keys | sort) == ["releaseCommit", "releaseTag"]
            and .releaseTag == $tag
            and .releaseCommit == $commit
          ' <<<"$deployment_identity" >/dev/null
          SMOKE_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "exact deployment smoke" --start-ms "$SMOKE_START" --end-ms "$SMOKE_END"
          echo "Candidate deployment smoke verified identity: $deployment_identity"

      - name: Promote candidate to canonical production
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # 严格获取并校验 promote 前 canonical production 的 release identity，fail-closed 防止盲切
          PREVIOUS_IDENTITY="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$RIVALHUB_PRODUCTION_BASE_URL/api/system/release")"
          jq -e '
            (keys | sort) == ["releaseCommit", "releaseTag"]
            and (.releaseTag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))
            and (.releaseCommit | test("^[0-9a-fA-F]{40}$"))
          ' <<<"$PREVIOUS_IDENTITY" >/dev/null
          PREVIOUS_TAG="$(jq -r .releaseTag <<<"$PREVIOUS_IDENTITY")"
          PREVIOUS_COMMIT="$(jq -r .releaseCommit <<<"$PREVIOUS_IDENTITY")"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_commit=$PREVIOUS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Previous canonical production identity confirmed: tag=$PREVIOUS_TAG, commit=$PREVIOUS_COMMIT"

          CANONICAL_DOMAIN="${RIVALHUB_PRODUCTION_BASE_URL#https://}"
          CANONICAL_DOMAIN="${CANONICAL_DOMAIN%%/*}"
          CANONICAL_DOMAIN_ENCODED="$(jq -rn --arg host "$CANONICAL_DOMAIN" '$host | @uri')"
          PREVIOUS_DEPLOYMENT_INFO="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${CANONICAL_DOMAIN_ENCODED}?teamId=${VERCEL_ORG_ID}")"
          jq -e --arg project "$VERCEL_PROJECT_ID" '
            (.id | strings | startswith("dpl_"))
            and .projectId == $project
            and .target == "production"
            and .readyState == "READY"
          ' <<<"$PREVIOUS_DEPLOYMENT_INFO" >/dev/null
          PREVIOUS_DEPLOYMENT_ID="$(jq -er '.id | strings | select(startswith("dpl_"))' <<<"$PREVIOUS_DEPLOYMENT_INFO")"
          echo "previous_deployment_id=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Previous canonical deployment resolved for rollback."

          wait_for_alias_job() {
            local expected_deployment_id="$1"
            local deadline="$(($(date +%s) + 180))"
            local project_state
            local job_status
            local to_deployment_id

            while :; do
              project_state="$(curl --fail --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 3 \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?rollbackInfo=true&teamId=${VERCEL_ORG_ID}")"
              job_status="$(jq -r '.lastAliasRequest.jobStatus // empty' <<<"$project_state")"
              to_deployment_id="$(jq -r '.lastAliasRequest.toDeploymentId // empty' <<<"$project_state")"

              if [[ "$job_status" == "succeeded" && "$to_deployment_id" == "$expected_deployment_id" ]]; then
                return 0
              fi
              if [[ "$job_status" == "failed" && "$to_deployment_id" == "$expected_deployment_id" ]]; then
                echo "Vercel alias operation failed for deployment $expected_deployment_id." >&2
                return 1
              fi
              if (( $(date +%s) >= deadline )); then
                echo "Timed out waiting for Vercel alias operation for deployment $expected_deployment_id (status=$job_status, target=$to_deployment_id)." >&2
                return 1
              fi
              sleep 2
            done
          }

          PROMOTE_START="$(date +%s%3N)"
          DEPLOYMENT_HOST="${DEPLOYMENT_URL#https://}"
          if [[ "$DEPLOYMENT_HOST" == "$DEPLOYMENT_URL" || "$DEPLOYMENT_HOST" == */* ]]; then
            echo "Vercel deployment URL is not an exact HTTPS hostname: $DEPLOYMENT_URL" >&2
            exit 1
          fi
          DEPLOYMENT_HOST_ENCODED="$(jq -rn --arg host "$DEPLOYMENT_HOST" '$host | @uri')"
          DEPLOYMENT_INFO="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_HOST_ENCODED}?teamId=${VERCEL_ORG_ID}")"
          jq -e --arg project "$VERCEL_PROJECT_ID" --arg host "$DEPLOYMENT_HOST" '
            (.id | strings | startswith("dpl_"))
            and .projectId == $project
            and .url == $host
            and .target == "production"
            and .readyState == "READY"
          ' <<<"$DEPLOYMENT_INFO" >/dev/null
          PROMOTE_DEPLOYMENT_ID="$(jq -er '.id | strings | select(startswith("dpl_"))' <<<"$DEPLOYMENT_INFO")"

          PROMOTE_STATUS="$(curl --fail --silent --show-error \
            --request POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${PROMOTE_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [[ "$PROMOTE_STATUS" != "201" && "$PROMOTE_STATUS" != "202" ]]; then
            echo "Unexpected Vercel promote response status: $PROMOTE_STATUS" >&2
            exit 1
          fi
          echo "Vercel promote request accepted for $PROMOTE_DEPLOYMENT_ID (HTTP $PROMOTE_STATUS); waiting for alias completion."
          wait_for_alias_job "$PROMOTE_DEPLOYMENT_ID"
          PROMOTE_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "promotion" --start-ms "$PROMOTE_START" --end-ms "$PROMOTE_END"
          echo "Promoted $DEPLOYMENT_URL to canonical production."

      - name: Smoke test canonical production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_TAG: ${{ steps.promote.outputs.previous_tag }}
          PREVIOUS_COMMIT: ${{ steps.promote.outputs.previous_commit }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.promote.outputs.previous_deployment_id }}
        run: |
          set -euo pipefail
          CANONICAL_START="$(date +%s%3N)"
          wait_for_alias_job() {
            local expected_deployment_id="$1"
            local deadline="$(($(date +%s) + 180))"
            local project_state
            local job_status
            local to_deployment_id

            while :; do
              project_state="$(curl --fail --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 3 \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?rollbackInfo=true&teamId=${VERCEL_ORG_ID}")"
              job_status="$(jq -r '.lastAliasRequest.jobStatus // empty' <<<"$project_state")"
              to_deployment_id="$(jq -r '.lastAliasRequest.toDeploymentId // empty' <<<"$project_state")"

              if [[ "$job_status" == "succeeded" && "$to_deployment_id" == "$expected_deployment_id" ]]; then
                return 0
              fi
              if [[ "$job_status" == "failed" && "$to_deployment_id" == "$expected_deployment_id" ]]; then
                echo "Vercel alias operation failed for deployment $expected_deployment_id." >&2
                return 1
              fi
              if (( $(date +%s) >= deadline )); then
                echo "Timed out waiting for Vercel alias operation for deployment $expected_deployment_id (status=$job_status, target=$to_deployment_id)." >&2
                return 1
              fi
              sleep 2
            done
          }

          smoke_canonical() {
            curl --fail --silent --show-error \
              --retry 8 --retry-all-errors --retry-delay 5 \
              "$RIVALHUB_PRODUCTION_BASE_URL/" >/dev/null || return 1
            canonical_identity="$(curl --fail --silent --show-error \
              --retry 8 --retry-all-errors --retry-delay 5 \
              "$RIVALHUB_PRODUCTION_BASE_URL/api/system/release")" || return 1
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" '
              (keys | sort) == ["releaseCommit", "releaseTag"]
              and .releaseTag == $tag
              and .releaseCommit == $commit
            ' <<<"$canonical_identity" >/dev/null || return 1
            echo "Canonical production identity confirmed: $canonical_identity"
            return 0
          }

          if ! smoke_canonical; then
            echo "::error::Canonical production smoke failed after promotion; initiating Vercel routing rollback..." >&2
            if ROLLBACK_STATUS="$(curl --fail --silent --show-error \
              --request POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{}' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/rollback/${PREVIOUS_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"; then
              if [[ "$ROLLBACK_STATUS" == "201" ]] && wait_for_alias_job "$PREVIOUS_DEPLOYMENT_ID"; then
                echo "Vercel rollback request succeeded; verifying canonical domain restored previous release identity..."
                reverted_identity="$(curl --fail --silent --show-error \
                  --retry 5 --retry-all-errors --retry-delay 3 \
                  "$RIVALHUB_PRODUCTION_BASE_URL/api/system/release")"
                echo "Reverted canonical identity: $reverted_identity"
                jq -e --arg tag "$PREVIOUS_TAG" --arg commit "$PREVIOUS_COMMIT" '
                  (keys | sort) == ["releaseCommit", "releaseTag"]
                  and .releaseTag == $tag
                  and .releaseCommit == $commit
                ' <<<"$reverted_identity" >/dev/null
                echo "Canonical domain successfully restored previous identity: tag=$PREVIOUS_TAG, commit=$PREVIOUS_COMMIT."
              else
                echo "::error::Vercel rollback did not complete successfully (HTTP $ROLLBACK_STATUS). Manual intervention required." >&2
              fi
            else
              echo "::error::Vercel rollback request failed! Manual intervention required." >&2
            fi
            exit 1
          fi
          CANONICAL_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "canonical smoke" --start-ms "$CANONICAL_START" --end-ms "$CANONICAL_END"

      - name: Provision and verify production scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_BASE_URL: https://match.starfie1d.top
        run: |
          if [[ -z "$CRON_SECRET" || "$CRON_SECRET" == "[SENSITIVE]" ]]; then
            echo "GitHub production environment secret CRON_SECRET is required." >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "scheduler provision/verify" -- bash -c '
            set -euo pipefail
            RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:scheduler:provision
            pnpm db:production:scheduler:verify
          '

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          # 兼容两种标题：手写 `## [1.30.0] - date` 与 changeset 生成的 `## 1.30.0`
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "(\\]| |$)" { found=1; next }
            found && $0 ~ "^## \\[?[0-9]" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_PUB_START="$(date +%s%3N)"
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" == "true" ]]; then
              echo "Release $RELEASE_TAG is immutable; keeping published metadata."
            else
              echo "Release $RELEASE_TAG already exists, updating notes..."
              gh release edit "$RELEASE_TAG" \
                --notes-file /tmp/release-notes.md \
                "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi
          RELEASE_PUB_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "GitHub Release publish" --start-ms "$RELEASE_PUB_START" --end-ms "$RELEASE_PUB_END"

      - name: Record workflow total wall time and summary
        if: always()
        run: |
          if [[ -n "$RELEASE_WORKFLOW_START_MS" ]]; then
            node scripts/ci/timing.mjs record --label "TOTAL wall time" --start-ms "$RELEASE_WORKFLOW_START_MS"
          fi
          node scripts/ci/timing.mjs summary
