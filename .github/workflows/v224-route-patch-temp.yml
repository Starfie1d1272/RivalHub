name: v2.2.4 route patch temp

on:
  push:
    branches:
      - starfie1d/release-hardening-v2.2.4

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: mark registration route request-bound'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: starfie1d/release-hardening-v2.2.4
      - name: Patch registration page and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/[seasonSlug]/register/page.tsx')
          text = path.read_text()
          marker = 'interface RegisterPageProps {'
          insertion = '// Registration combines public season state with authenticated viewer state.\nexport const instant = false;\n\n'
          if 'export const instant = false;' not in text:
              if marker not in text:
                  raise SystemExit('register page marker not found')
              text = text.replace(marker, insertion + marker, 1)
              path.write_text(text)
          Path('.github/workflows/v224-route-patch-temp.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/[seasonSlug]/register/page.tsx' .github/workflows/v224-route-patch-temp.yml
          git diff --cached --check
          git commit -m 'fix: mark registration route request-bound'
          git push origin HEAD:starfie1d/release-hardening-v2.2.4
