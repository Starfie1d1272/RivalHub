name: Prepare v2.0.2 once

on:
  push:
    branches:
      - release/v2.0.2

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v2.0.2
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert release input
        run: |
          test "$(node -p "require('./package.json').version")" = "2.0.1"
          test -f .changeset/green-production-schema-gate.md
          test "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | wc -l | tr -d ' ')" = "1"

      - name: Consume Changeset
        run: pnpm exec changeset version

      - name: Editorial review for stable patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '2.0.2') throw new Error(`Expected 2.0.2, got ${pkg.version}`);
          if (fs.existsSync('.changeset/green-production-schema-gate.md')) {
            throw new Error('Changeset was not consumed');
          }
          const path = 'CHANGELOG.md';
          const source = fs.readFileSync(path, 'utf8');
          const section = `## 2.0.2\n\n### Changed\n\n- 生产发版改为由 \`v*\` tag 的 release workflow 串行执行数据库前向迁移、严格校验、精确 Vercel Production 部署与 smoke test；普通 \`main\` production build 不能绕过 release gate。\n\n### Fixed\n\n- 公开玩家竞技档案改用长期竞技位置与平台目录展示位置、段位、赛季和星数，不再把赛事报名快照当作长期资料。\n\n### Migration & Operations\n\n- Production release 会在应用部署前执行 active Drizzle migration chain 并进行 exact verify；迁移或校验失败会中止新版本部署并保留上一版 production。\n`;
          const pattern = /## 2\.0\.2[\s\S]*?(?=\n## 2\.0\.1)/;
          if (!pattern.test(source)) throw new Error('Generated 2.0.2 changelog section not found');
          fs.writeFileSync(path, source.replace(pattern, section));
          NODE

      - name: Commit release source
        run: |
          git rm .github/workflows/release-prepare-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: v2.0.2"
          git push origin HEAD:release/v2.0.2
