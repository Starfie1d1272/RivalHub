name: Release writer inventory
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect existing production channels
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_DEPLOY_SSH_KEY: ${{ secrets.LINUX_DEPLOY_SSH_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ vars.LINUX_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/release/writer-inventory-diagnostic.sh
