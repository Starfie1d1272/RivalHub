name: Issue 561 benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  vitest:
    name: vitest / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        candidate: [V0, V1, V2, S0, S1, U0, U1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Run three candidate measurements
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-561-benchmark"
          case "$CANDIDATE" in
            V0|V1|V2) project="unit-domain-node" ;;
            S0|S1) project="unit-server-node" ;;
            U0|U1) project="unit-react-jsdom" ;;
            *) echo "unknown candidate: $CANDIDATE" >&2; exit 1 ;;
          esac

          pool="forks"
          isolate=""
          case "$CANDIDATE" in
            V1|V2|S1|U1) pool="threads" ;;
          esac
          if [[ "$CANDIDATE" == "V2" ]]; then isolate="--no-isolate"; fi

          summary_file="$RUNNER_TEMP/issue-561-benchmark/$CANDIDATE.tsv"
          : > "$summary_file"
          for run in 1 2 3; do
            started_ms=$(date +%s%3N)
            pnpm exec vitest run --project "$project" --pool "$pool" $isolate --reporter dot
            elapsed_ms=$(( $(date +%s%3N) - started_ms ))
            printf '%s\t%s\t%s\n' "$CANDIDATE" "$run" "$elapsed_ms" | tee -a "$summary_file"
          done

          if [[ "$CANDIDATE" == "V2" ]]; then
            for seed in 561 562; do
              pnpm exec vitest run --project "$project" --pool threads --no-isolate --sequence.shuffle --sequence.seed "$seed" --reporter dot
            done
          fi

          {
            echo "### $CANDIDATE"
            echo
            echo '| candidate | run | wall time |'
            echo '| --- | ---: | ---: |'
            awk -F '\t' '{ printf "| %s | %s | %.2fs |\n", $1, $2, $3 / 1000 }' "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-561-vitest-${{ matrix.candidate }}
          path: ${{ runner.temp }}/issue-561-benchmark
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: postgres / P${{ matrix.workers }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_DB_TARGET: local
      RIVALHUB_INTEGRATION_WORKERS: ${{ matrix.workers }}
      RIVALHUB_TIMING: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Measure three real PostgreSQL runs
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-561-benchmark"
          summary_file="$RUNNER_TEMP/issue-561-benchmark/P${WORKERS}.tsv"
          : > "$summary_file"
          for run in 1 2 3; do
            started_ms=$(date +%s%3N)
            pnpm test:integration:pg17
            elapsed_ms=$(( $(date +%s%3N) - started_ms ))
            printf 'P%s\t%s\t%s\n' "$WORKERS" "$run" "$elapsed_ms" | tee -a "$summary_file"
          done
          {
            echo "### P$WORKERS"
            echo
            echo '| candidate | run | wall time |'
            echo '| --- | ---: | ---: |'
            awk -F '\t' '{ printf "| %s | %s | %.2fs |\n", $1, $2, $3 / 1000 }' "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-561-postgres-P${{ matrix.workers }}
          path: ${{ runner.temp }}/issue-561-benchmark
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    name: playwright / E${{ matrix.workers }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    env:
      PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
      PLAYWRIGHT_CHANNEL: chrome
      RIVALHUB_TIMING: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Start one minimal Supabase stack
        run: pnpm db:local:start-services

      - name: Bootstrap and verify one system stack
        run: |
          pnpm db:local:bootstrap-services
          pnpm db:local:verify-supabase
          google-chrome --version

      - name: Measure three E2E bodies
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-561-benchmark"
          summary_file="$RUNNER_TEMP/issue-561-benchmark/E${WORKERS}.tsv"
          : > "$summary_file"
          for run in 1 2 3; do
            started_ms=$(date +%s%3N)
            pnpm test:e2e
            elapsed_ms=$(( $(date +%s%3N) - started_ms ))
            printf 'E%s\t%s\t%s\n' "$WORKERS" "$run" "$elapsed_ms" | tee -a "$summary_file"
          done
          {
            echo "### E$WORKERS"
            echo
            echo '| candidate | run | wall time |'
            echo '| --- | ---: | ---: |'
            awk -F '\t' '{ printf "| %s | %s | %.2fs |\n", $1, $2, $3 / 1000 }' "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-561-playwright-E${{ matrix.workers }}
          path: ${{ runner.temp }}/issue-561-benchmark
          if-no-files-found: ignore
          retention-days: 7
