name: Reconcile auth permissions

on:
  push:
    branches:
      - "refactor/v2-auth-permissions"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Capture actual merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev
          set +e
          git merge --no-commit --no-ff origin/dev
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf 'NO_CONFLICTS\n' > reconcile-auth-conflicts.txt
          else
            git diff --name-only --diff-filter=U | sort > reconcile-auth-conflicts.txt
          fi
          git merge --abort || true
          git add reconcile-auth-conflicts.txt
          git commit -m 'chore(auth): capture reconciliation conflicts'
          git push origin HEAD:refactor/v2-auth-permissions
