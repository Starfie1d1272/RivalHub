name: Reconcile auth permissions

on:
  push:
    branches:
      - "refactor/v2-auth-permissions"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Reconcile latest dev and regenerate auth migration
        shell: bash
        run: |
          set +e
          bash -x scripts/reconcile-auth-permissions.sh > /tmp/reconcile-auth.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          git merge --abort 2>/dev/null || true
          git reset --hard HEAD
          cp /tmp/reconcile-auth.log reconcile-auth-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconcile-auth-diagnostic.txt
          git commit -m 'chore(auth): capture reconciliation failure point'
          git push origin HEAD:refactor/v2-auth-permissions
          exit 1
