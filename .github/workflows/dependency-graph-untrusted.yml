name: Trusted dependency graph for untrusted PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-dependency-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Dependabot and forks cannot write dependency metadata with their PR token.
    if: github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      # Trusted base only. PR checkout, lifecycle and executables are prohibited.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          require-lockfile: true
      - name: Fetch exact PR lockfile as data and parse with trusted canonical owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RIVALHUB_DEPENDENCY_SHA: ${{ github.event.pull_request.head.sha }}
          RIVALHUB_DEPENDENCY_REF: ${{ format('refs/pull/{0}/head', github.event.pull_request.number) }}
        run: |
          gh api --method GET "repos/$PR_HEAD_REPOSITORY/contents/pnpm-lock.yaml" -f ref="$RIVALHUB_DEPENDENCY_SHA" --jq .content | base64 --decode > pr-lockfile.yaml
          pnpm exec tsx scripts/dependencies/snapshot.ts generate dependency-snapshot.json pr-lockfile.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: dependency-snapshot.json
          if-no-files-found: error
          retention-days: 14

  submit:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/dependency-submit.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      ref: ${{ format('refs/pull/{0}/head', github.event.pull_request.number) }}
      receipt_artifact: dependency-submission-${{ github.event.pull_request.head.sha }}
