name: Dependency graph

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - scripts/dependencies/**
      - .github/workflows/dependency-graph.yml
  schedule:
    - cron: '35 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          require-lockfile: true
      - name: Build snapshot from exact main source
        run: pnpm exec tsx scripts/dependencies/snapshot.ts generate dependency-snapshot.json
        env:
          RIVALHUB_DEPENDENCY_SHA: ${{ github.sha }}
          RIVALHUB_DEPENDENCY_REF: refs/heads/main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: dependency-snapshot.json
          if-no-files-found: error
          retention-days: 14

  submit:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only trusted main code; no dependency install or application execution here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-snapshot
      - name: Submit current main dependency metadata
        run: node scripts/dependencies/submit.mjs dependency-snapshot.json submission-receipt.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-submission-receipt
          path: submission-receipt.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: submit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          require-lockfile: true
      - name: Verify indexed packages, edges and direct roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bounded indexing delay; HTTP and graph mismatches remain failures.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" > dependency-sbom.json
            if pnpm exec tsx scripts/dependencies/snapshot.ts verify-sbom dependency-sbom.json > readback-summary.json; then
              cat readback-summary.json >> "$GITHUB_STEP_SUMMARY"
              echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              sha256sum pnpm-lock.yaml >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-sbom-readback
          path: |
            dependency-sbom.json
            readback-summary.json
          if-no-files-found: error
          retention-days: 14
