name: Production recovery backup

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: rivalhub-production-state-serialization
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: backup / ${{ github.event_name == 'schedule' && 'daily' || 'manual' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      RIVALHUB_BACKUP_CLASS: ${{ github.event_name == 'schedule' && 'daily' || 'manual' }}
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: rrrebbxfghmgnoyyeqqd
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RIVALHUB_PRODUCTION_SUPABASE_URL: https://rrrebbxfghmgnoyyeqqd.supabase.co
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RIVALHUB_BACKUP_AGE_RECIPIENT: ${{ vars.RIVALHUB_BACKUP_AGE_RECIPIENT }}
      RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
      RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
      RIVALHUB_R2_ACCESS_KEY_ID: ${{ secrets.RIVALHUB_R2_ACCESS_KEY_ID }}
      RIVALHUB_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVALHUB_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Install age encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version
          aws --version

      - name: Create, encrypt, upload, and read back production snapshot
        run: pnpm db:recovery:backup "$RIVALHUB_BACKUP_CLASS"
