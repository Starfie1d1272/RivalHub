name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      run_static: ${{ steps.plan.outputs.run_static }}
      run_postgres: ${{ steps.plan.outputs.run_postgres }}
      run_system: ${{ steps.plan.outputs.run_system }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan changed surface
        id: plan
        run: node scripts/ci/plan.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}

  static:
    name: static / ${{ matrix.task }}
    if: needs.plan.outputs.run_static == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [type-app, type-tests, type-scripts, lint, unit, dead-code, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run static task
        run: |
          case "${{ matrix.task }}" in
            type-app) pnpm type-check:app ;;
            type-tests) pnpm type-check:tests ;;
            type-scripts) pnpm type-check:scripts ;;
            lint) pnpm lint ;;
            unit) pnpm test ;;
            dead-code) pnpm knip && pnpm knip --production ;;
            build) env -u DATABASE_URL pnpm build ;;
            *) echo "unknown static task" >&2; exit 1 ;;
          esac

  postgres:
    name: postgres
    if: needs.plan.outputs.run_postgres == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_DB_TARGET: local
      RIVALHUB_MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      RIVALHUB_MIGRATION_HEAD_SHA: ${{ github.sha }}
      RIVALHUB_INTEGRATION_WORKERS: 2
      RIVALHUB_TIMING: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Measure PostgreSQL readiness
        shell: bash
        run: |
          started_ms=$(date +%s%3N)
          for attempt in {1..120}; do
            if PGPASSWORD=postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres >/dev/null 2>&1; then
              ended_ms=$(date +%s%3N)
              echo "timing pg-ready: $((ended_ms - started_ms))ms"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL service did not become ready within 120 seconds" >&2
          exit 1
      - run: pnpm db:check
      - run: pnpm test:integration:pg17

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  system:
    name: system
    if: needs.plan.outputs.run_system == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:local:start-services
      - run: pnpm db:local:bootstrap-services
      - run: pnpm db:local:verify-supabase
      - run: google-chrome --version
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_WORKERS: 1

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [plan, static, postgres, system, dependency-review]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate required evidence
        run: node scripts/ci/gate.mjs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
