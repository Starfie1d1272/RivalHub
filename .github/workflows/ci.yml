name: CI

on:
  push:
    branches: [main, dev, feat/major-2027-integration]
  pull_request:
    branches: [main, dev, feat/major-2027-integration]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm type-check

      - run: pnpm lint

      # migration integrity gate：纯静态 snapshot 链校验，无需 DATABASE_URL / secrets
      # （本地已验证：移除 .env.local 后 drizzle-kit check 仍正常通过）
      - run: pnpm exec drizzle-kit check

      - run: pnpm test:coverage

      - run: pnpm build
