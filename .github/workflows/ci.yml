name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  CI: true
  RIVALHUB_TIMING: 1
  PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.agent-tmp/pnpm-store

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run_started_at: ${{ steps.timing-start.outputs.run_started_at }}
      full: ${{ steps.plan.outputs.full }}
      run_static: ${{ steps.plan.outputs.run_static }}
      run_postgres: ${{ steps.plan.outputs.run_postgres }}
      run_system: ${{ steps.plan.outputs.run_system }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      static_matrix: ${{ steps.plan.outputs.static_matrix }}
      system_matrix: ${{ steps.plan.outputs.system_matrix }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      related_sources: ${{ steps.plan.outputs.related_sources }}
      explicit_tests: ${{ steps.plan.outputs.explicit_tests }}
      postgres_mode: ${{ steps.plan.outputs.postgres_mode }}
      integration_specs: ${{ steps.plan.outputs.integration_specs }}
      system_mode: ${{ steps.plan.outputs.system_mode }}
      e2e_specs: ${{ steps.plan.outputs.e2e_specs }}
      live_evidence: ${{ steps.plan.outputs.live_evidence }}
      mobile_search_evidence: ${{ steps.plan.outputs.mobile_search_evidence }}
      gate_name: ${{ steps.plan.outputs.gate_name }}
      release_metadata_only: ${{ steps.plan.outputs.release_metadata_only }}
    steps:
      - name: Capture workflow timing start
        id: timing-start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          test -n "$started" && test "$started" != null
          echo "run_started_at=$started" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Protect published rulebooks
        run: node scripts/ci/check-published-rules.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Plan changed surface
        id: plan
        run: node scripts/ci/plan.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' || github.event.before == '')) }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || 'false' }}

  static:
    name: static / ${{ matrix.task }}
    if: needs.plan.outputs.run_static == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.static_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start bootstrap/install timing
        run: echo "RIVALHUB_BOOTSTRAP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      # Stable keys avoid pnpm/setup uploading the same store after every job.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          require-lockfile: true

      - name: Record bootstrap/install timing
        if: always()
        run: node scripts/ci/timing.mjs record --label "bootstrap/install" --start-ms "$RIVALHUB_BOOTSTRAP_STARTED_MS"

      - name: Run static task
        env:
          RIVALHUB_TIMING_TEST_KIND: ${{ startsWith(matrix.task, 'unit-') && 'unit' || '' }}
          STATIC_TASK: ${{ matrix.task }}
          STATIC_PROJECT: ${{ matrix.project || '' }}
          STATIC_CHANGED_PATHS: ${{ toJSON(matrix.changedPaths) }}
          STATIC_RELATED_SOURCES: ${{ toJSON(matrix.relatedSources) }}
          STATIC_EXPLICIT_TESTS: ${{ toJSON(matrix.explicitTests) }}
          RIVALHUB_VITEST_PROJECT: ${{ matrix.project || '' }}
        run: node scripts/ci/timing.mjs "static/${{ matrix.task }}" -- node scripts/ci/run-static-task.mjs

      - name: Assert no flaky Vitest tests
        if: ${{ always() && matrix.project == 'unit-react-jsdom' }}
        run: node scripts/ci/assert-no-flaky.mjs --project unit-react-jsdom

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-static-${{ matrix.task }}
          path: ${{ runner.temp }}/rivalhub-timing-${{ github.job }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  postgres:
    name: postgres
    if: needs.plan.outputs.run_postgres == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RIVALHUB_DB_TARGET: local
      RIVALHUB_MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      RIVALHUB_MIGRATION_HEAD_SHA: ${{ github.sha }}
      RIVALHUB_PRODUCTION_STABLE_REF: origin/main
      RIVALHUB_INTEGRATION_WORKERS: 3
      RIVALHUB_TIMING: 1
      RIVALHUB_INTEGRATION_SPECS: ${{ needs.plan.outputs.integration_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Start bootstrap/install timing
        run: echo "RIVALHUB_BOOTSTRAP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      # Stable keys avoid pnpm/setup uploading the same store after every job.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          require-lockfile: true
      - name: Record bootstrap/install timing
        if: always()
        run: node scripts/ci/timing.mjs record --label "bootstrap/install" --start-ms "$RIVALHUB_BOOTSTRAP_STARTED_MS"
      - name: Fetch production stable lineage
        run: git fetch origin main --tags
      - name: Measure PostgreSQL readiness
        run: |
          node scripts/ci/timing.mjs "postgres/service ready" -- bash -c '
            started_ms=$(date +%s%3N)
            for attempt in {1..120}; do
              if PGPASSWORD=postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres >/dev/null 2>&1; then
                echo "timing pg-ready: $(( $(date +%s%3N) - started_ms ))ms"
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL service did not become ready within 120 seconds" >&2
            exit 1
          '
      - name: PostgreSQL migration checks
        run: node scripts/ci/timing.mjs "postgres/migration" -- bash -c 'pnpm db:check && pnpm db:release-compat'
      - name: PostgreSQL integration
        env:
          RIVALHUB_TIMING_TEST_KIND: integration
        run: node scripts/ci/timing.mjs "postgres/integration body" -- pnpm test:integration:pg17
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ github.job }}
          path: ${{ runner.temp }}/rivalhub-timing-${{ github.job }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  system:
    name: system / ${{ matrix.task }}
    if: needs.plan.outputs.run_system == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.system_matrix) }}
    env:
      RIVALHUB_LIVE_EVIDENCE: ${{ matrix.live && '1' || '0' }}
      RIVALHUB_LOCAL_SERVICE_PROFILE: ${{ (matrix.task == 'production' || matrix.task == 'browser-live') && 'auth' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start bootstrap/install timing
        run: echo "RIVALHUB_BOOTSTRAP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      # Stable keys avoid pnpm/setup uploading the same store after every job.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          require-lockfile: true
      - name: Record bootstrap/install timing
        if: always()
        run: node scripts/ci/timing.mjs record --label "bootstrap/install" --start-ms "$RIVALHUB_BOOTSTRAP_STARTED_MS"
      - name: Restore Supabase images
        id: supabase-images
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ runner.os }}-${{ runner.arch }}-supabase-images-v1-${{ hashFiles('pnpm-lock.yaml', 'supabase/config.toml') }}
      - name: Load Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: node scripts/ci/timing.mjs "system/image load" -- docker image load --input "$RUNNER_TEMP/supabase-images.tar"
      - name: Supabase startup
        run: node scripts/ci/timing.mjs "system/Supabase startup" -- pnpm db:local:start-services
      - name: Cache immutable Supabase images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mapfile -t images < <(docker image ls --filter 'reference=ghcr.io/supabase/*' --filter 'reference=ghcr.io/supabase/cli/*' --quiet | sort -u)
          test "${#images[@]}" -gt 0
          node scripts/ci/timing.mjs "system/image export" -- docker image save --output "$RUNNER_TEMP/supabase-images.tar" "${images[@]}"
      - name: System bootstrap
        run: node scripts/ci/timing.mjs "system/bootstrap" -- pnpm db:local:bootstrap-services
      - name: Provider contract
        if: matrix.task == 'provider'
        run: node scripts/ci/timing.mjs "system/provider verify" -- pnpm db:local:verify-supabase
      - name: Checkout Mizar
        if: matrix.task == 'provider' && matrix.live
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Starfie1d1272/Mizar
          ref: e52c455fb4caea0284dc5f6d0d8ec52bb8159364 # Mizar #118, published radar-view 0.1.0
          path: .mizar-checkout
      - name: Mizar cross-repo contract
        if: matrix.task == 'provider' && matrix.live
        run: node scripts/ci/timing.mjs "system/mizar contract" -- pnpm mizar:contract-check .mizar-checkout
      - name: Browser runtime
        run: google-chrome --version
      - name: E2E body
        if: startsWith(matrix.task, 'browser-')
        env:
          RIVALHUB_TIMING_TEST_KIND: e2e
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_WORKERS: 2
          RIVALHUB_E2E_SPECS: ${{ toJSON(matrix.specs) }}
        run: node scripts/ci/timing.mjs "system/E2E body" -- pnpm test:e2e

      - name: Production browser smoke
        if: matrix.task == 'production'
        env:
          RIVALHUB_TIMING_TEST_KIND: e2e
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_WORKERS: 2
          RIVALHUB_E2E_SPECS: '[]'
        run: node scripts/ci/timing.mjs "system/production browser smoke" -- pnpm test:e2e -- --config=playwright.production.config.ts

      - name: Prepare safe system artifacts
        if: failure()
        run: node scripts/ci/prepare-system-artifacts.mjs
      - name: Upload system failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-failure-evidence-${{ matrix.task }}
          path: .agent-tmp/system-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ github.job }}-${{ matrix.task }}
          path: ${{ runner.temp }}/rivalhub-timing-${{ github.job }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  gate:
    name: ${{ needs.plan.outputs.gate_name }}
    if: ${{ always() }}
    needs: [plan, static, postgres, system, dependency-review]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate current changelog release shape
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          HEADING="## [$VERSION]"
          if ! grep -Fxq "$HEADING" CHANGELOG.md; then
            echo "CHANGELOG.md must contain heading $HEADING." >&2
            exit 1
          fi

          SECTION="$(awk -v heading="$HEADING" '
            $0 == heading { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if grep -Eq '^### (Patch|Minor|Major) Changes$' <<< "$SECTION"; then
            echo "CHANGELOG.md current version still contains a default Changesets heading; perform editorial cleanup before merge." >&2
            exit 1
          fi

          PREFIX="[$VERSION]: https://github.com/Starfie1d1272/RivalHub/compare/"
          LINE="$(grep -F "$PREFIX" CHANGELOG.md || true)"
          if [[ -z "$LINE" || "$LINE" != *"...v$VERSION" ]]; then
            echo "CHANGELOG.md must contain a compare link for version $VERSION." >&2
            exit 1
          fi

      - name: Validate required evidence
        run: node scripts/ci/gate.mjs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
          GATE_NAME: ${{ needs.plan.outputs.gate_name }}

      - name: Record required gate wall time
        if: always()
        env:
          RUN_STARTED_AT: ${{ needs.plan.outputs.run_started_at }}
        run: node scripts/ci/timing.mjs record --label "required gate wall time" --start-iso "$RUN_STARTED_AT"
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ github.job }}
          path: ${{ runner.temp }}/rivalhub-timing-${{ github.job }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

      - name: Enforce required gate latency budget
        env:
          RUN_STARTED_AT: ${{ needs.plan.outputs.run_started_at }}
        run: node scripts/ci/timing.mjs record --label "required gate latency budget" --start-iso "$RUN_STARTED_AT" --budget-ms 180000
