name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm type-check

      - run: pnpm lint

      # migration integrity gate：纯静态 snapshot 链校验，无需 DATABASE_URL / secrets
      # （本地已验证：移除 .env.local 后 drizzle-kit check 仍正常通过）
      - run: pnpm exec drizzle-kit check

      - run: pnpm test:coverage

      - run: pnpm build
        env:
          # Explicit non-listening loopback target exercises the existing unavailable-DB fallback
          # without restoring pg defaults or exposing CI to any remote database.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/postgres?sslmode=disable
