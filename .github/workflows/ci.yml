name: CI

on:
  push:
    branches: [main, dev, feat/major-2027-integration]
  pull_request:
    branches: [main, dev, feat/major-2027-integration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm check

      # Keep the migration-chain gate explicit in CI even though check also
      # includes it, so a future check-script edit cannot silently remove it.
      - run: pnpm db:check

      # This build must not depend on DATABASE_URL or a fake listening target.
      - run: pnpm build

  local:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:local:bootstrap

      - run: pnpm test:integration

      - run: pnpm test:e2e

  # The main ruleset requires the stable `ci` context. Keep it as a small
  # aggregate gate over the split quality and local evidence jobs.
  ci:
    if: ${{ always() }}
    needs: [quality, local]
    runs-on: ubuntu-latest
    steps:
      - name: Verify quality and local gates
        if: ${{ needs.quality.result != 'success' || needs.local.result != 'success' }}
        run: exit 1
      - run: echo "quality and local gates passed"
