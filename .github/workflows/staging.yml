name: Staging database rehearsal

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要验证并用于 staging rehearsal 的 branch、tag 或 commit"
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-24.04
    environment: staging
    env:
      NEXT_TELEMETRY_DISABLED: 1
      RIVALHUB_LOCAL_PROJECT_ID: rivalhub-scratch-staging-${{ github.run_id }}-${{ github.run_attempt }}
      RIVALHUB_DB_TARGET: staging
      RIVALHUB_STAGING_PROJECT_CONFIRM: dtdzxnzjtohzjmfkighg
      RIVALHUB_ALLOW_REMOTE_DB_WRITE: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Record requested ref and checked-out commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          echo "Requested ref: $REQUESTED_REF"
          echo "Checked-out commit: $(git rev-parse HEAD)"

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Select isolated local project
        run: |
          node -e 'const fs = require("node:fs"); const p = "supabase/config.toml"; const s = fs.readFileSync(p, "utf8"); const original = /^project_id = "rivalhub"$/m; if (!original.test(s)) throw new Error("Unexpected local project config"); fs.writeFileSync(p, s.replace(original, `project_id = "${process.env.RIVALHUB_LOCAL_PROJECT_ID}"`));'

      - name: Start Local PostgreSQL for migration replay
        run: pnpm db:local:start-db

      - name: Migrate staging with protected canonical wrapper
        env:
          RIVALHUB_STAGING_DB_PASSWORD: ${{ secrets.RIVALHUB_STAGING_DB_PASSWORD }}
        run: pnpm db:staging:migrate

      - name: Verify staging schema and migration ledger
        env:
          RIVALHUB_STAGING_DB_PASSWORD: ${{ secrets.RIVALHUB_STAGING_DB_PASSWORD }}
        run: pnpm db:staging:verify

      - name: Stop Local PostgreSQL
        if: always()
        run: pnpm db:local:stop -- --project-id "$RIVALHUB_LOCAL_PROJECT_ID"
