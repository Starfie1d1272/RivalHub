name: Reconcile competition runtime

on:
  push:
    branches:
      - starfie1d/refactor-v2-competition-runtime

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Reconcile latest dev and regenerate migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev

          set +e
          git merge --no-commit --no-ff origin/dev
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            allowed='drizzle/migrations/meta/0021_snapshot.json
drizzle/migrations/meta/_journal.json
src/actions/major-prestart.ts
tests/integration/db/major-start.test.ts
tests/unit/actions/captain-identity.test.ts
tests/unit/db/major-profile-migration.test.ts'
            unexpected="$(comm -23 <(printf '%s\n' "$conflicts" | sort) <(printf '%s\n' "$allowed" | sort))"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected conflicts:' >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --theirs -- "$path"
              git add "$path"
            done <<< "$conflicts"
          fi

          git rm -f drizzle/migrations/0021_competition_bracket_state.sql 2>/dev/null || true

          python <<'PY'
          from pathlib import Path

          p = Path('src/actions/major-prestart.ts')
          s = p.read_text()
          old = 'import { checkStandardMajorCapabilities, normalizeAffiliationRules, normalizeRegistrationConfig, normalizeStagePlan, normalizeTeamRegistrationConfig } from "@/types/season";'
          new = 'import { checkStandardMajorCapabilities } from "@/lib/competition/definition";\nimport { normalizeAffiliationRules, normalizeRegistrationConfig, normalizeStagePlan, normalizeTeamRegistrationConfig } from "@/types/season";'
          if old in s:
              s = s.replace(old, new)
          needle = 'function standardMajorOrThrow(season: typeof seasons.$inferSelect): void {\n  const result = checkStandardMajorCapabilities({'
          repl = 'function standardMajorOrThrow(season: typeof seasons.$inferSelect): void {\n  if (season.competitionTemplate !== "major") {\n    throw new AppError(ErrorCode.SEASON_CAPABILITY_DISABLED, "当前赛事不是 Major 赛事模板，不能管理赛前事实。");\n  }\n  const result = checkStandardMajorCapabilities({'
          if needle in s:
              s = s.replace(needle, repl)
          elif 'season.competitionTemplate !== "major"' not in s:
              raise SystemExit('cannot apply explicit Major template gate')
          p.write_text(s)

          p = Path('tests/integration/db/major-start.test.ts')
          s = p.read_text()
          s = s.replace('id, slug, name, kind, status, registration_mode, has_captain_voting, has_draft,', 'id, slug, name, kind, competition_template, status, registration_mode, has_captain_voting, has_draft,')
          s = s.replace("VALUES ($1, $2, 'Local Major Start', 'Major', 'registration', $3, $4, $5, $6::json, $7::json, $8::json, $9::json, $10, $11, $12, $13::text[])", "VALUES ($1, $2, 'Local Major Start', 'Major', 'major', 'registration', $3, $4, $5, $6::json, $7::json, $8::json, $9::json, $10, $11, $12, $13::text[])")
          p.write_text(s)

          p = Path('tests/unit/actions/captain-identity.test.ts')
          s = p.read_text().replace('  bracketData: null,\n', '')
          p.write_text(s)
          PY

          pnpm install --frozen-lockfile
          pnpm exec drizzle-kit generate --name competition_bracket_state

          python <<'PY'
          from pathlib import Path
          import json, re

          migrations = sorted(Path('drizzle/migrations').glob('0022_*.sql'))
          if len(migrations) != 1:
              raise SystemExit(f'expected one 0022 migration, got {[p.name for p in migrations]}')
          migration = migrations[0]
          s = migration.read_text()
          drop = 'ALTER TABLE "seasons" DROP COLUMN "bracket_data";'
          backfill = '''INSERT INTO "competition_bracket_states" ("competition_id", "data", "updated_at")\nSELECT "id", "bracket_data"::jsonb, "updated_at"\nFROM "seasons"\nWHERE "bracket_data" IS NOT NULL;--> statement-breakpoint\nDO $$\nDECLARE\n  source_count bigint;\n  state_count bigint;\nBEGIN\n  SELECT count(*) INTO source_count FROM "seasons" WHERE "bracket_data" IS NOT NULL;\n  SELECT count(*) INTO state_count FROM "competition_bracket_states";\n  IF source_count <> state_count THEN\n    RAISE EXCEPTION 'competition bracket state backfill verification failed: expected %, got %', source_count, state_count;\n  END IF;\nEND $$;--> statement-breakpoint\n''' + drop
          if drop not in s:
              raise SystemExit('generated migration does not drop seasons.bracket_data as expected')
          migration.write_text(s.replace(drop, backfill))

          p = Path('tests/integration/db/migrations/competition-bracket-state.test.ts')
          s = p.read_text().replace('rivalhub_0021', 'rivalhub_0022').replace('startsWith("0021_")', 'startsWith("0022_")').replace('0021 bracket state migration', '0022 bracket state migration')
          p.write_text(s)

          journal = json.loads(Path('drizzle/migrations/meta/_journal.json').read_text())
          last = journal['entries'][-1]
          if last['idx'] != 22:
              raise SystemExit(f'expected generated journal idx 22, got {last}')
          tag = last['tag']
          p = Path('tests/unit/db/major-profile-migration.test.ts')
          s = p.read_text()
          s = re.sub(r'idx: 21,\n\s+version: "7",\n\s+tag: "0021_team_entry_current_owners",', f'idx: 22,\n      version: "7",\n      tag: "{tag}",', s)
          p.write_text(s)
          PY

          pnpm db:check
          pnpm type-check
          pnpm lint

          git rm .github/workflows/reconcile-competition-runtime.yml
          git add -A
          git commit -m 'chore(competition-runtime): reconcile latest migration chain'
          git push origin HEAD:starfie1d/refactor-v2-competition-runtime
