name: Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trigger:
    name: Cron / watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    steps:
      - name: Require main operator source
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Freeze verified Production source
        id: production
        run: pnpm --silent db:production:scheduler:watchdog-plan freeze

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.production.outputs.release_commit }}
          path: .scheduler-production
          persist-credentials: false

      - name: Plan deployed scheduler fallbacks
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIVALHUB_SCHEDULER_RELEASE_TAG: ${{ steps.production.outputs.release_tag }}
          RIVALHUB_SCHEDULER_RELEASE_COMMIT: ${{ steps.production.outputs.release_commit }}
          PLAN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(pnpm --silent db:production:scheduler:watchdog-plan "$PLAN_MODE" .scheduler-production)"
          echo "job_keys=$PLAN" >> "$GITHUB_OUTPUT"
          if [[ "$PLAN_MODE" == scheduled ]]; then
            echo "### Scheduler freshness" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$PLAN" == "[]" ]]; then
              echo "Primary scheduler is fresh." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Primary scheduler fallback requested for $PLAN" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Scheduler fallback required::$PLAN"
            fi
          fi

      - name: Invoke required scheduler fallbacks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_RELEASE_TAG: ${{ steps.production.outputs.release_tag }}
          RIVALHUB_SCHEDULER_RELEASE_COMMIT: ${{ steps.production.outputs.release_commit }}
          CRON_JOB_KEYS: ${{ steps.plan.outputs.job_keys }}
          CRON_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'github-manual' || 'github-watchdog' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent db:production:scheduler:watchdog-plan verify
          mapfile -t JOB_KEYS < <(jq -r '.[]' <<< "$CRON_JOB_KEYS")
          if [ "${#JOB_KEYS[@]}" -eq 0 ]; then
            echo "Primary scheduler is healthy; no watchdog fallback required."
            exit 0
          fi
          PRODUCTION_ORIGIN="$(node --input-type=module -e 'import { OFFICIAL_PRODUCTION } from "./src/lib/runtime/official-deployment-profile.mjs"; process.stdout.write(OFFICIAL_PRODUCTION.origin)')"
          FAILED=0
          for CRON_JOB_KEY in "${JOB_KEYS[@]}"; do
            pnpm --silent db:production:scheduler:watchdog-plan verify
            if CRON_HTTP_STATUS="$(curl --fail --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 2 \
              --retry-connrefused \
              --retry-max-time 180 \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "X-RivalHub-Cron-Source: ${CRON_SOURCE}" \
              "${PRODUCTION_ORIGIN}/api/cron/${CRON_JOB_KEY}")" &&
              [[ "$CRON_HTTP_STATUS" == 2[0-9][0-9] ]]; then
              continue
            else
              echo "::error::Deployed scheduler target failed: ${CRON_JOB_KEY}"
              FAILED=1
            fi
          done
          exit "$FAILED"
      - name: Check verified production backup age
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/recovery-backup.yml/runs?status=success&branch=main&per_page=1" > "$RUNNER_TEMP/latest-recovery-backup.json"
          node scripts/db/recovery/backup-freshness.mjs "$RUNNER_TEMP/latest-recovery-backup.json" >> "$GITHUB_STEP_SUMMARY"
