name: Refresh Preview Mirror

on:
  workflow_dispatch:
    inputs:
      apply_current_migrations:
        description: Apply additional migrations to the imported mirror in rivalhub-dev
        required: false
        default: false
        type: boolean
      migration_commit:
        description: Immutable commit providing optional staging SQL migrations
        required: false
        default: ""
        type: string

concurrency:
  group: rivalhub-preview-mirror-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export-production:
    name: export encrypted mirror
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Verify the database projection matches the export policy
        run: pnpm exec tsx scripts/db/preview/reader-sql.ts --check
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
      - name: Export and encrypt read-only snapshot
        env:
          DB_TRAFFIC_KEY: ${{ secrets.DB_TRAFFIC_KEY }}
          PRODUCT_TELEMETRY_ENDPOINT: ${{ vars.PRODUCT_TELEMETRY_ENDPOINT }}
          RIVALHUB_PREVIEW_SSH_KEY: ${{ secrets.RIVALHUB_PREVIEW_SSH_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ vars.LINUX_DEPLOY_KNOWN_HOSTS }}
          RIVALHUB_PREVIEW_AGE_RECIPIENT: ${{ vars.RIVALHUB_PREVIEW_AGE_RECIPIENT }}
          RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST: ${{ vars.RIVALHUB_PREVIEW_PUBLIC_ASSET_ALLOWLIST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$RIVALHUB_PREVIEW_AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]
          directory="$RUNNER_TEMP/rivalhub-preview"
          mkdir -p "$directory"
          snapshot="$directory/preview-mirror.json"
          projection="$directory/projection.jsonl"
          key="$directory/preview-key"
          hosts="$directory/known_hosts"
          trap 'for file in "$projection" "$snapshot" "$key" "$hosts"; do unlink "$file" 2>/dev/null || true; done' EXIT
          [[ "$RIVALHUB_PREVIEW_SSH_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]
          [[ "$LINUX_DEPLOY_KNOWN_HOSTS" == *"[47.103.131.158]:52222"* ]]
          printf '%s\n' "$RIVALHUB_PREVIEW_SSH_KEY" > "$key"
          printf '%s\n' "$LINUX_DEPLOY_KNOWN_HOSTS" > "$hosts"
          unset RIVALHUB_PREVIEW_SSH_KEY LINUX_DEPLOY_KNOWN_HOSTS
          timeout 150s ssh -n -T -C -p 52222 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=10 root@47.103.131.158 > "$projection"
          unlink "$key"
          pnpm db:preview:export "$snapshot" "$projection"
          gzip -c "$snapshot" | age --encrypt --recipient "$RIVALHUB_PREVIEW_AGE_RECIPIENT" --output "$snapshot.gz.age"
      - name: Upload encrypted mirror
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-mirror-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/rivalhub-preview/preview-mirror.json.gz.age
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  refresh-dev:
    name: decrypt and refresh rivalhub-dev
    needs: export-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify immutable migration input and current refresh
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_COMMIT: ${{ inputs.migration_commit }}
        run: |
          set -euo pipefail
          if [[ -n "$MIGRATION_COMMIT" && ! "$MIGRATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected a full migration commit SHA.' >&2
            exit 1
          fi
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-preview-mirror.yml/runs?branch=main&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id')
            [[ "$latest" == "$GITHUB_RUN_ID" ]] || { echo 'A newer mirror refresh superseded this retry.' >&2; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.apply_current_migrations && inputs.migration_commit != '' && inputs.migration_commit != github.sha
        with:
          ref: ${{ inputs.migration_commit }}
          path: .agent-tmp/preview-migration-ref
          sparse-checkout: drizzle/migrations
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
      - name: Download encrypted mirror
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-mirror-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/rivalhub-preview
      - name: Decrypt and import into staging
        env:
          RIVALHUB_DB_TARGET: staging
          RIVALHUB_STAGING_PROJECT_CONFIRM: dtdzxnzjtohzjmfkighg
          RIVALHUB_STAGING_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
          RIVALHUB_ALLOW_REMOTE_DB_WRITE: staging
          RIVALHUB_PREVIEW_RESET_CONFIRM: dtdzxnzjtohzjmfkighg
          RIVALHUB_STAGING_DB_PASSWORD: ${{ secrets.RIVALHUB_STAGING_DB_PASSWORD }}
          RIVALHUB_PREVIEW_DEV_SECRET_KEY: ${{ secrets.RIVALHUB_PREVIEW_DEV_SECRET_KEY }}
          RIVALHUB_PREVIEW_AGE_IDENTITY: ${{ secrets.RIVALHUB_PREVIEW_AGE_IDENTITY }}
          RIVALHUB_PREVIEW_APPLY_CURRENT_MIGRATIONS: ${{ inputs.apply_current_migrations }}
          RIVALHUB_PREVIEW_MIGRATIONS_DIR: ${{ inputs.migration_commit != '' && inputs.migration_commit != github.sha && '.agent-tmp/preview-migration-ref/drizzle/migrations' || 'drizzle/migrations' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          snapshot="$RUNNER_TEMP/rivalhub-preview/preview-mirror.json"
          identity="$RUNNER_TEMP/rivalhub-preview/identity"
          trap 'unlink "$snapshot" 2>/dev/null || true; unlink "$identity" 2>/dev/null || true' EXIT
          test -n "$RIVALHUB_PREVIEW_AGE_IDENTITY"
          printf '%s\n' "$RIVALHUB_PREVIEW_AGE_IDENTITY" > "$identity"
          unset RIVALHUB_PREVIEW_AGE_IDENTITY
          age --decrypt --identity "$identity" "$snapshot.gz.age" | gzip -dc > "$snapshot"
          unlink "$identity"
          pnpm exec tsx scripts/db/run-server-cli.ts scripts/db/preview/refresh.ts "$snapshot"
