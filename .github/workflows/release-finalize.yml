name: Release finalize

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      previous_release_tag:
        required: true
        type: string
      previous_release_commit:
        required: true
        type: string
      release_mode:
        required: true
        type: string
      application_changed:
        required: true
        type: string
      migration_changed:
        required: true
        type: string
      requires_production_migration:
        required: true
        type: string
      requires_scheduler_provision:
        required: true
        type: string
      deployment_url:
        required: false
        type: string
        default: ""
      workflow_started_at:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  production_migration:
    if: inputs.release_mode == 'fresh' && inputs.requires_production_migration == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: rivalhub-production-state-serialization
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ inputs.release_sha }}
      REQUIRES_PRODUCTION_MIGRATION: ${{ inputs.requires_production_migration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 运行 production migration 与验证
        if: env.REQUIRES_PRODUCTION_MIGRATION == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret DATABASE_URL 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "Production migration" -- env RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:migrate
          node scripts/ci/timing.mjs "Production DB verify" -- pnpm db:production:verify

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  application_promotion:
    if: >-
      always() &&
      inputs.release_mode == 'fresh' &&
      (needs.production_migration.result == 'success' || needs.production_migration.result == 'skipped')
    needs: production_migration
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      VERCEL_ORG_ID: team_0eIkBawGTdVjwYHdyrb20ZVV
      VERCEL_PROJECT_ID: prj_3bjmfKrSqRh4szrkEE4HpavnhI0E
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ inputs.release_sha }}
      RIVALHUB_PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
      RIVALHUB_PREVIOUS_RELEASE_COMMIT: ${{ inputs.previous_release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 执行 release routing / rollback
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/timing.mjs "Release routing / rollback" -- pnpm release:routing

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  production_scheduler:
    if: >-
      always() &&
      inputs.release_mode == 'fresh' &&
      inputs.requires_scheduler_provision == 'true' &&
      needs.application_promotion.result == 'success'
    needs: application_promotion
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: rivalhub-production-state-serialization
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      RIVALHUB_DB_TARGET: production
      RIVALHUB_PRODUCTION_BASE_URL: https://match.starfie1d.top
      RIVALHUB_PRODUCTION_PROJECT_CONFIRM: sucokfotkypwqkckfynp
      RIVALHUB_PRODUCTION_DB_HOST_CONFIRM: aws-0-ap-northeast-1.pooler.supabase.com:6543
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 配置并验证 production scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RIVALHUB_SCHEDULER_BASE_URL: https://match.starfie1d.top
        run: |
          if [[ -z "$CRON_SECRET" || "$CRON_SECRET" == "[SENSITIVE]" ]]; then
            echo "GitHub production Environment secret CRON_SECRET 未设置。" >&2
            exit 1
          fi
          node scripts/ci/timing.mjs "Production scheduler provision/verify" -- bash -c '
            set -euo pipefail
            RIVALHUB_ALLOW_REMOTE_DB_WRITE=production pnpm db:production:scheduler:provision
            pnpm db:production:scheduler:verify
          '

      - name: Write timing summary
        if: always()
        run: node scripts/ci/timing.mjs summary

  publish:
    if: >-
      always() &&
      ((inputs.release_mode == 'fresh' && needs.application_promotion.result == 'success' &&
        (needs.production_scheduler.result == 'success' || needs.production_scheduler.result == 'skipped')) ||
       (inputs.release_mode == 'resume' && needs.application_promotion.result == 'skipped' &&
        needs.production_scheduler.result == 'skipped'))
    needs: [application_promotion, production_scheduler]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
      RIVALHUB_TIMING: 1
      RIVALHUB_TIMING_TITLE: "Release 阶段耗时"
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RIVALHUB_RELEASE_SHA: ${{ inputs.release_sha }}
      RIVALHUB_PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
      RIVALHUB_PREVIOUS_RELEASE_COMMIT: ${{ inputs.previous_release_commit }}
      RIVALHUB_RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_WORKFLOW_STARTED_AT: ${{ inputs.workflow_started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: 生成 Production delta release notes
        run: pnpm release:notes > /tmp/release-notes.md

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_PUB_START="$(date +%s%3N)"
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" == "true" ]]; then
              echo "GitHub Release $RELEASE_TAG 已 immutable；保留已发布 metadata。"
            else
              echo "GitHub Release $RELEASE_TAG 已存在，更新 notes…"
              gh release edit "$RELEASE_TAG" \
                --notes-file /tmp/release-notes.md \
                "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi
          RELEASE_PUB_END="$(date +%s%3N)"
          node scripts/ci/timing.mjs record --label "GitHub Release publish" --start-ms "$RELEASE_PUB_START" --end-ms "$RELEASE_PUB_END"

      - name: 记录 workflow 总耗时并生成 summary
        if: always()
        run: |
          node scripts/ci/timing.mjs record --label "Total" --start-iso "$RELEASE_WORKFLOW_STARTED_AT"
          node scripts/ci/timing.mjs summary
