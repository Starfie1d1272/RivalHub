name: Recovery R2 retention contract

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "读取验证或在受保护环境中应用 retention contract"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply

permissions:
  contents: read

jobs:
  retention:
    name: r2-retention / ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      RIVALHUB_R2_ACCOUNT_ID: ${{ vars.RIVALHUB_R2_ACCOUNT_ID }}
      RIVALHUB_R2_BUCKET: ${{ vars.RIVALHUB_R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Read back or apply R2 retention contract
        shell: bash
        run: |
          case "$OPERATION" in
            verify) pnpm db:recovery:r2:verify ;;
            apply) pnpm db:recovery:r2:apply ;;
            *) echo "Unsupported recovery R2 operation." >&2; exit 1 ;;
          esac
